<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <title>Log45 Panel</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #111827;
      --muted: #666;
      --item-bg: #f5f5f5;
      --border: #ddd;
      --btn-blue: #007bff;
      --btn-red: #dc3545;
      --btn-purple: #6f42c1;
      --spinner-border: rgba(0, 0, 0, 0.15);
      --spinner-top: rgba(0, 0, 0, 0.6);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0d0f;
        --text: #e6eef8;
        --muted: #9aa4b2;
        --item-bg: #0f1720;
        --border: #1f2937;
        --btn-blue: #0b6bff;
        --btn-red: #b91c1c;
        --btn-purple: #7c3aed;
        --spinner-border: rgba(255, 255, 255, 0.08);
        --spinner-top: rgba(255, 255, 255, 0.9);
      }
    }

    body {
      font-family: Arial;
      padding: 8px;
      background: var(--bg);
      color: var(--text);
    }

    .toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 8px
    }

    .logo-container {
      margin-bottom: 8px;
    }

    .logo {
      font-family: mono-space, monospace;
      font-weight: 700;
      font-size: 18px;
      line-height: 1;
      color: #f59e0b;
    }

    .logo-digit.logo-4 {
      font-size: 24px;
      color: #10b981;
    }

    .logo-digit.logo-5 {
      font-size: 24px;
      color: #10b981;
    }

    button {
      padding: 6px 10px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
    }

    #listBtn {
      background: var(--btn-blue);
      color: #fff
    }

    #clearBtn {
      background: var(--btn-red);
      color: #fff
    }

    #debugBtn {
      background: var(--btn-purple);
      color: #fff
    }

    /* copy button style */
    .copy-btn {
      background: #6f42c1;
      color: #fff;
      padding: 6px 10px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      margin-top: 6px;
    }

    .item {
      border: 1px solid var(--border);
      padding: 8px;
      margin: 8px 0;
      border-radius: 4px;
      background: var(--item-bg);
      word-break: break-word
    }

    pre {
      white-space: pre-wrap;
      margin: 0;
      color: var(--text);
    }

    #results {
      max-height: 600px;
      overflow: auto
    }

    /* simple loading overlay */
    .loading {
      display: none;
      position: relative;
      margin: 8px 0;
      padding: 8px;
      font-size: 13px;
      color: var(--muted);
    }

    .loading.active {
      display: block;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid var(--spinner-border);
      border-top-color: var(--spinner-top);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div class="logo-container">
    <div class="logo">log<span class="logo-digit logo-4">4</span><span class="logo-digit logo-5">5</span></div>
  </div>
  <div class="toolbar">
    <button id="listBtn">Hatalı İstekleri Listele</button>
    <button id="clearBtn">Temizle</button>
  </div>
  <div id="loading" class="loading"><span class="spinner"></span><span id="loadingText">Yükleniyor…</span></div>
  <div id="results"></div>
  <hr />

</body>

</html>
